name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build, package check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Maintained Node LTS lines. (Node 20 reached end-of-life in April 2026.)
        # The `ws` code path is covered on every version by injecting `ws` explicitly.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same scripts, same order as `pnpm check:all` (package.json). Keep them in sync.
      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (SDK with coverage thresholds, then every other workspace)
        run: pnpm test:ci

      - name: Build
        run: pnpm build

      # publint: package.json fields point at real files with the right formats.
      # attw: TypeScript resolves correct types under node10/node16 (CJS+ESM)/bundler.
      - name: Check published package shape
        run: pnpm check:package

      - name: Upload coverage report
        if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: packages/sdk/coverage
          retention-days: 7
