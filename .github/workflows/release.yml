name: Release

# On every push to main:
#   - pending changesets   → open/update the "Version Packages" PR
#   - that PR just merged  → build, verify, pack, and publish to npm
#
# Publishing uses npm trusted publishing (OIDC): no npm token is stored
# anywhere. npm accepts a short-lived identity token that GitHub issues to
# this workflow file, in this repository, in the `npm` environment, and
# attaches a provenance attestation to the release automatically.
#
# The work is split so the only job that can publish (`id-token: write`)
# never runs a build: it receives tarballs that an unprivileged job built
# and verified. That follows the Changesets trusted-publishing template.
on:
  push:
    branches: [main]

# Every job declares exactly the permissions it needs.
permissions: {}

# Never run two releases at once, and never cancel one half-way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-mode:
    name: Decide whether to version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false # no shared cache in release jobs (cache poisoning)
      - run: pnpm install --frozen-lockfile
      - id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    name: Open or update the Version Packages PR
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump to the PR branch
      pull-requests: write # open/update the PR
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/version@v2
        with:
          script: pnpm changeset version

  pack:
    name: Verify, build and pack
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # Re-check exactly what is published (the SDK). The whole repo, including
      # the Rust/Wasm package, is checked by CI on every push and PR.
      - run: pnpm exec eslint packages/sdk
      - run: pnpm --filter @tickforge/sdk typecheck
      - run: pnpm --filter @tickforge/sdk test
      - run: pnpm --filter @tickforge/sdk build
      - run: pnpm --filter @tickforge/sdk check:package
      - id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish to npm (trusted publishing)
    needs: pack
    runs-on: ubuntu-latest
    # Must match the environment configured on npmjs.com. The environment can
    # be restricted to the main branch in GitHub settings.
    environment: npm
    permissions:
      contents: write # push the git tag and create the GitHub release
      id-token: write # request the OIDC token npm exchanges for publish rights
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      # pnpm hands the actual upload to the npm CLI, which needs >= 11.5.1 for
      # OIDC. Node 24 bundles a newer npm; fail loudly if that ever changes.
      - name: Check npm supports trusted publishing
        run: |
          v="$(npm --version)"
          echo "npm $v"
          node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) { console.error("::error::npm >= 11.5.1 is required for trusted publishing"); process.exit(1); }
          ' "$v"
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
