<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Live crypto market data streamed by tickforge, a typed, resilient TypeScript SDK, running in a Web Worker."
    />
    <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='4' width='3' height='8' rx='1' fill='%232a78d6'/%3E%3Crect x='10' y='2' width='3' height='9' rx='1' fill='%23e34948'/%3E%3C/svg%3E"
    />
    <title>tickforge live demo</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        const t = localStorage.getItem("tickforge-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
